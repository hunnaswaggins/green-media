name: Update YouTube Subscribers

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-subscribers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch YouTube subscriber counts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          handles = [
              "greenvsgames",
              "virtualridergreen",
              "16bitgreen",
              "greenvscars",
              "greenkittyfam",
              "ridermrgreen",
              "fullcommitriding"
          ]

          channels = {}

          for handle in handles:
              params = urllib.parse.urlencode({
                  "part": "statistics",
                  "forHandle": handle,
                  "key": os.environ["YOUTUBE_API_KEY"]
              })

              url = "https://www.googleapis.com/youtube/v3/channels?" + params

              with urllib.request.urlopen(url) as response:
                  data = json.load(response)

              stats = data["items"][0]["statistics"]
              channels[handle] = int(stats["subscriberCount"])

          result = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "total": sum(channels.values()),
              "channels": channels
          }

          with open("youtube-stats.json", "w") as file:
              json.dump(result, file, indent=2)

          print("Subscriber counts updated successfully.")
          PY

      - name: Save updated subscriber counts
        run: |
          git config user.name "GreenHub Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube subscriber counts"
            git push
          fi
